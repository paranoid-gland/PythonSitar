<body>
<script>
  function toggleMenu() {
    const navLinks = document.getElementById("nav-links");
    navLinks.classList.toggle("show");
  }
</script>

{% set path = request.path %}
<nav class="nav-bar">
  <div class="nav-container">
    <div class="nav-left">
      <a href="/" class="logo">
        <img src="/static/pictures/logowhite.svg" alt="Logo">
      </a>
    </div>
    <div class="nav-right">
<div id="nav-links" class="nav-links">
    <a href="https://arnaldopangia.substack.com/" target="_blank" rel="noopener noreferrer" class="{% if path == '/webapps' %}active{% endif %}">Substack</a>
    <a href="/#contacts">Contacts</a>
    <a href="/projects" class="{% if path == '/projects' %}active{% endif %}">Portfolio</a>
    <a href="/wacky" class="{% if path == '/wacky' %}active{% endif %}">Wacky Code</a>
</div>
      <button class="hamburger" onclick="toggleMenu()">☰</button>
    </div>
  </div>
</nav>
<main> 
    {% block content %}
    {% endblock %}
</main>



  <footer class="footer">
    <p>Coded and designed in {{ current_year }} by Arnaldo Pangia <br> Built with <strong>Python</strong>, <strong>Flask</strong> & <strong>CSS</strong></p>
  </footer>
  <script src="{{ url_for('static', filename='js/main.js') }}"></script>
</body>
</html>
